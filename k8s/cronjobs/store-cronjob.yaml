apiVersion: batch/v1
kind: CronJob
metadata:
  name: hivebox-store
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: store
              image: curlimages/curl:latest
              command:
                - curl
                - -f
                - http://hivebox-service/store
          restartPolicy: OnFailure
