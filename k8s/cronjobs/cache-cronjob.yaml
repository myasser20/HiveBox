apiVersion: batch/v1
kind: CronJob
metadata:
  name: hivebox-cache
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cache-updater
              image: curlimages/curl:latest
              command:
                - curl
                - -f
                - http://hivebox-service/cache
          restartPolicy: OnFailure