
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: silo
  template:
    metadata:
      labels:
        app: silo
    spec:
      containers:
        - name: silo
          image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: silo-server-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: silo-server-credentials
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: silo-storage
              mountPath: /data
      volumes:
        - name: silo-storage
          persistentVolumeClaim:
            claimName: silo-pvc
